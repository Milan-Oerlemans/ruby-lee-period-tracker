<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ruby's Period Tracker</title>

    <base href="/" />

    <meta
      name="color-scheme"
      content="light dark"
    />
    <!-- Lets us control PWA status bar theme on Android -->
    <meta
      name="theme-color"
      content="#fce4ec"
    />
    <!-- Lets us control PWA status bar theme on iOS -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      name="format-detection"
      content="telephone=no"
    />
    <meta
      name="msapplication-tap-highlight"
      content="no"
    />

    <link
      rel="manifest"
      href="/manifest.json"
    />

    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="/assets/icon/favicon.ico"
    />
    <link
      rel="apple-touch-icon"
      href="/assets/icon/apple-touch-icon.jpeg"
    />

    <!-- add to homescreen for ios -->
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="Ruby's Period Tracker"
    />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black"
    />
  </head>

  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
